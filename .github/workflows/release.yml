name: Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Rename release asset
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk codex-scratchpad-${{ github.ref_name }}.apk
          cp app/build/outputs/apk/debug/app-debug.apk codex-scratchpad-latest.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            codex-scratchpad-${{ github.ref_name }}.apk
            codex-scratchpad-latest.apk

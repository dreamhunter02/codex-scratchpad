name: Feature request
description: Suggest an improvement to dev.board
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the smallest useful solution.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy or network impact
      description: Does this add cloud storage, accounts, telemetry, or a new network path?

